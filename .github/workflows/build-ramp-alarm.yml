name: Build Ramp Alarm APK

on:
  push:
    paths: ['ramp-alarm/**', '.github/workflows/build-ramp-alarm.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: ramp-alarm
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ramp-alarm-debug-apk
          path: ramp-alarm/app/build/outputs/apk/debug/app-debug.apk
